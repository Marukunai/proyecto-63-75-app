<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Marukunai Personal Journal</title>
  <defs>
    <radialGradient id="ogVioleta" cx="12%" cy="0%" r="70%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ogCian" cx="100%" cy="100%" r="65%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trazo" x1="136" y1="170" x2="376" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#8b7cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="chispa" x1="256" y1="70" x2="256" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="textoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="puntos" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="#090d16"/>
  <rect width="1200" height="630" fill="url(#puntos)"/>
  <rect width="1200" height="630" fill="url(#ogVioleta)"/>
  <rect width="1200" height="630" fill="url(#ogCian)"/>

  <!-- Tarjeta con el isotipo -->
  <g transform="translate(96 155)">
    <rect width="320" height="320" rx="72" fill="#0f1524" stroke="url(#borde)" stroke-width="2"/>
    <g transform="translate(10 6) scale(0.586)">
      <g fill="none" stroke="url(#trazo)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <path d="M136 360 V178 C180 182 228 214 256 290 C284 214 332 182 376 178 V360"/>
        <path d="M136 360 C190 360 232 368 256 388 C280 368 322 360 376 360"/>
        <path d="M256 290 V388"/>
      </g>
      <g fill="none" stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round">
        <path d="M176 262 C196 266 212 274 226 290"/>
        <path d="M176 304 C196 308 212 316 226 332"/>
        <path d="M336 262 C316 266 300 274 286 290" stroke="#7dd3fc"/>
        <path d="M336 304 C316 308 300 316 286 332" stroke="#7dd3fc"/>
      </g>
      <path filter="url(#glow)" fill="url(#chispa)"
            d="M256 82 C260 106 266 112 290 116 C266 120 260 126 256 150 C252 126 246 120 222 116 C246 112 252 106 256 82 Z"/>
    </g>
  </g>

  <!-- Textos -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif">
    <text x="476" y="232" font-size="22" font-weight="600" letter-spacing="5" fill="#94a3b8">TU DIARIO PERSONAL</text>
    <text x="472" y="318" font-size="84" font-weight="800" letter-spacing="-2" fill="#f8fafc">Marukunai</text>
    <text x="474" y="382" font-size="50" font-weight="600" letter-spacing="-1" fill="url(#textoGrad)">Personal Journal</text>
    <text x="476" y="430" font-size="23" font-weight="400" fill="#cbd5e1">Reflexiona, cuida tus hábitos y crece a tu ritmo.</text>

    <!-- Pills ambientales -->
    <g font-size="19" font-weight="600">
      <g transform="translate(476 466)">
        <rect width="160" height="42" rx="21" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-opacity="0.55"/>
        <circle cx="22" cy="21" r="5" fill="#c084fc"/>
        <text x="36" y="28" fill="#e9d5ff">Reflexiones</text>
      </g>
      <g transform="translate(650 466)">
        <rect width="126" height="42" rx="21" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.55"/>
        <circle cx="22" cy="21" r="5" fill="#38bdf8"/>
        <text x="36" y="28" fill="#e0f2fe">Hábitos</text>
      </g>
      <g transform="translate(790 466)">
        <rect width="192" height="42" rx="21" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-opacity="0.55"/>
        <circle cx="22" cy="21" r="5" fill="#c084fc"/>
        <text x="36" y="28" fill="#e9d5ff">Notas Privadas</text>
      </g>
      <g transform="translate(476 520)">
        <rect width="236" height="42" rx="21" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.55"/>
        <circle cx="22" cy="21" r="5" fill="#38bdf8"/>
        <text x="36" y="28" fill="#e0f2fe">Evolución Personal</text>
      </g>
    </g>
  </g>

  <!-- Línea de acento inferior -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#textoGrad)"/>
</svg>
