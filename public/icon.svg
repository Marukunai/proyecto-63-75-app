<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Marukunai Personal Journal</title>
  <defs>
    <radialGradient id="bgVioleta" cx="18%" cy="12%" r="75%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgCian" cx="88%" cy="92%" r="70%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trazo" x1="136" y1="170" x2="376" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#8b7cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="chispa" x1="256" y1="70" x2="256" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo (a sangre: el SO aplica sus propias esquinas / máscara) -->
  <rect width="512" height="512" fill="#090d16"/>
  <rect width="512" height="512" fill="url(#bgVioleta)"/>
  <rect width="512" height="512" fill="url(#bgCian)"/>

  <!-- Isotipo: la "M" es un diario abierto; el valle de la M es el lomo -->
  <g fill="none" stroke="url(#trazo)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Páginas superiores = trazos de la M -->
    <path d="M136 360 V178 C180 182 228 214 256 290 C284 214 332 182 376 178 V360"/>
    <!-- Base del libro -->
    <path d="M136 360 C190 360 232 368 256 388 C280 368 322 360 376 360"/>
    <!-- Lomo -->
    <path d="M256 290 V388"/>
  </g>

  <!-- Líneas de escritura sutiles -->
  <g fill="none" stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round">
    <path d="M176 262 C196 266 212 274 226 290"/>
    <path d="M176 304 C196 308 212 316 226 332"/>
    <path d="M336 262 C316 266 300 274 286 290" stroke="#7dd3fc"/>
    <path d="M336 304 C316 308 300 316 286 332" stroke="#7dd3fc"/>
  </g>

  <!-- Chispa: la reflexión / idea que nace del diario -->
  <path filter="url(#glow)" fill="url(#chispa)"
        d="M256 82 C260 106 266 112 290 116 C266 120 260 126 256 150 C252 126 246 120 222 116 C246 112 252 106 256 82 Z"/>
</svg>
